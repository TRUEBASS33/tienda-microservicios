# API Gateway: único punto de entrada (puerto 8080 en tu máquina).
# Las rutas /internal/* NO se exponen: solo se usan entre contenedores.

server {
    listen 80;

    location = /health {
        default_type application/json;
        return 200 '{"gateway":"ok"}';
    }

    location /auth/      { proxy_pass http://usuarios-service:3001; }
    location /usuarios   { proxy_pass http://usuarios-service:3001; }
    location /productos  { proxy_pass http://productos-service:3002; }
    location /pedidos    { proxy_pass http://pedidos-service:3003; }

    # Cualquier otra ruta (incluida /internal/*) responde 404
    location / {
        default_type application/json;
        return 404 '{"error":"Ruta no encontrada"}';
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
